name: Apple

# The Apple side of the full check (#55; docs/verification.md): TomoCore's tests, the Mac and iPhone apps built
# unsigned, and the iPhone's UI journeys on a simulator. GitHub's macOS runners are free for this public repository;
# still, draft PRs skip these jobs (SERP's CI standard), and they run once the PR is ready for review, on every push
# after that, and on main. No secrets: nothing here signs, uploads, or talks to iCloud. The builds are unsigned
# (CODE_SIGNING_ALLOWED=NO) and leave iCloud out (TOMO_ICLOUD_ENV= empties Info.plist's TomoICloudEnvironment, so
# TomoSync stays off: CloudKit stops an app that lacks the entitlement). A change to docs alone (`**/*.md`, `docs/**`)
# skips the jobs' steps, not the jobs, so each still reports success (SERP's CI standard, ci-workflows.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read   # the changes job lists a PR's files

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOMO_HEADLESS: "1"

jobs:
  # Whether anything but docs changed. Docs alone skip the Apple jobs' steps; the jobs still run and pass, so a
  # required check never sits pending (ci-workflows.md: skip docs-only changes inside the workflow).
  changes:
    name: Code or docs only
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      # Fails toward running: a manual run, or a filter that errored, counts as code.
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        continue-on-error: true
        with:
          predicate-quantifier: every   # a file counts as code when it matches neither docs pattern
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  tomocore:
    name: TomoCore tests (swift test)
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - name: Use the pinned Xcode (.xcode-version)
        if: needs.changes.outputs.code == 'true'
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app" && xcodebuild -version
      - name: swift test
        if: needs.changes.outputs.code == 'true'
        working-directory: TomoCore
        run: swift test
      - name: Docs only, nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo "Only docs changed (**/*.md, docs/**), so TomoCore's tests are skipped."

  apps:
    name: Build the Mac and iPhone apps (unsigned)
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - name: Use the pinned Xcode (.xcode-version)
        if: needs.changes.outputs.code == 'true'
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app" && xcodebuild -version
      - name: Docs only, nothing to build
        if: needs.changes.outputs.code != 'true'
        run: echo "Only docs changed (**/*.md, docs/**), so the apps aren't built."
      - name: Mac app
        if: needs.changes.outputs.code == 'true'
        run: >
          xcodebuild -project mac-demo/NotchBuddy/NotchBuddy.xcodeproj -scheme NotchBuddy -configuration Debug
          -derivedDataPath build/mac CODE_SIGNING_ALLOWED=NO TOMO_ICLOUD_ENV= build
      - name: iPhone app and widgets
        if: needs.changes.outputs.code == 'true'
        run: >
          xcodebuild -project ios-demo/Tomodachi/Tomodachi.xcodeproj -scheme Tomodachi -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
          TOMO_ICLOUD_ENV= build

  iphone-ui:
    name: iPhone UI journeys (Pull Request plan)
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - name: Docs only, no journeys to run
        if: needs.changes.outputs.code != 'true'
        run: echo "Only docs changed (**/*.md, docs/**), so the UI journeys are skipped."
      # A slow suite runs once per tree: a pull request's passing run leaves a receipt, and the push of the same tree
      # to main skips the suite. The lookup counts only unexpired receipts from this repository's own runs, as the
      # reference workflow does (ci-workflows.md); an error looking one up runs the suite.
      - name: Look for this tree's receipt
        if: needs.changes.outputs.code == 'true'
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          found=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=passed-iphone-ui-$tree" --jq \
              "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)] | length") || found=0
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Use the pinned Xcode (.xcode-version)
        if: needs.changes.outputs.code == 'true' && steps.receipt.outputs.found == '0'
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app" && xcodebuild -version
      - name: Its own simulator
        if: needs.changes.outputs.code == 'true' && steps.receipt.outputs.found == '0'
        id: sim
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')
          udid=$(xcrun simctl create tomo-ci com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit and UI tests, the Pull Request plan
        if: needs.changes.outputs.code == 'true' && steps.receipt.outputs.found == '0'
        run: >
          xcodebuild test -project ios-demo/Tomodachi/Tomodachi.xcodeproj -scheme Tomodachi -testPlan PullRequest
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/ios
          -resultBundlePath build/PullRequest.xcresult CODE_SIGNING_ALLOWED=NO TOMO_ICLOUD_ENV=
      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-results
          path: build/PullRequest.xcresult
          retention-days: 7
      - name: Leave a receipt for this tree
        if: needs.changes.outputs.code == 'true' && steps.receipt.outputs.found == '0'
        run: echo "${{ steps.receipt.outputs.tree }}" > receipt.txt
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.code == 'true' && steps.receipt.outputs.found == '0'
        with:
          name: passed-iphone-ui-${{ steps.receipt.outputs.tree }}
          path: receipt.txt
          retention-days: 30
          overwrite: true   # a re-run uploads the same name again
