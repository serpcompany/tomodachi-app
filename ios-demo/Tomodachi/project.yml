name: Tomodachi
options:
  bundleIdPrefix: com.zenbujapanese
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  TomoCore:
    path: ../../TomoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO

schemes:
  Tomodachi:
    build:
      targets:
        Tomodachi: all
    run:
      config: Debug

targets:
  Tomodachi:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    dependencies:
      - package: TomoCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tomodachi
        CFBundleDisplayName: Tomodachi
        CFBundleIdentifier: com.zenbujapanese.tomodachi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.0.1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Tomo listens when you answer out loud."
        NSSpeechRecognitionUsageDescription: "Tomo turns what you say into text to understand you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi
        PRODUCT_NAME: Tomodachi
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
