name: Tomodachi
options:
  bundleIdPrefix: com.zenbujapanese
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  TomoCore:
    path: ../../TomoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # TSMC LLC's team, the Zenbu Japanese app's too (decisions.md). Xcode signs automatically: simulator builds run
    # locally, device builds get a development profile (xcodebuild -allowProvisioningUpdates registers the
    # App IDs and the App Group the first time).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 847HR8U8D9
    # Shared with the widgets (TomoGlance) and with the Mac (TomoSync): read from Info.plist, never hard-coded.
    TOMO_APP_GROUP: group.com.zenbujapanese.tomo
    TOMO_ICLOUD_CONTAINER: iCloud.com.zenbujapanese.tomo
  configs:
    # iCloud sync (TomoSync): Debug builds use CloudKit's Development environment, TestFlight and the App Store
    # Production. Xcode sets the iCloud and push environments in the entitlements when it exports.
    Debug:
      TOMO_ICLOUD_ENV: Development
    Release:
      TOMO_ICLOUD_ENV: Production

schemes:
  Tomodachi:
    build:
      targets:
        Tomodachi: all
    run:
      config: Debug

targets:
  Tomodachi:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Shared
        type: group
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: TomoCore
      - target: TomoWidgets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tomodachi
        CFBundleDisplayName: Tomodachi
        CFBundleIdentifier: com.zenbujapanese.tomo
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]   # CloudKit's push when the Mac changed Tomo (TomoSync)
        TomoICloudEnvironment: $(TOMO_ICLOUD_ENV)   # this build has iCloud (TomoSync)
        TomoCloudContainer: $(TOMO_ICLOUD_CONTAINER)
        TomoAppGroup: $(TOMO_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false   # only Apple's own encryption (HTTPS): no export paperwork
        # No microphone or speech-recognition text: answers are choices (TomoGame.talkAsChoices), and TomoCore
        # leaves its listener out of iOS builds, so the app never asks (#92).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomo
        PRODUCT_NAME: Tomodachi
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Resources/Tomodachi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Tomo on sky blue, drawn from its code (TOMO_RENDER_ICON)
    postBuildScripts:
      - name: Leave out the Spanish draft
        script: '"$SRCROOT/../scripts/strip-packs.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"'
        basedOnDependencyAnalysis: false

  # Home Screen widgets (issue #52). Reads TomoGlance from the App Group; draws Tomo with TomoMovingChick.
  TomoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: TomoCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tomodachi
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        TomoAppGroup: $(TOMO_APP_GROUP)
        UIAppFonts: [TomoReady0.ttf, TomoReady1.ttf, TomoReady2.ttf, TomoSleep0.ttf, TomoSleep1.ttf, TomoSleep2.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomo.widgets
        PRODUCT_NAME: TomoWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Leave out the Spanish draft
        script: '"$SRCROOT/../scripts/strip-packs.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"'
        basedOnDependencyAnalysis: false
