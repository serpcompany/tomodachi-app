name: Tomodachi
options:
  bundleIdPrefix: com.zenbujapanese
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  TomoCore:
    path: ../../TomoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # The team Pedos ships with (W3GXL2NQQP). Xcode signs automatically: simulator builds run
    # locally, device builds get a development profile (xcodebuild -allowProvisioningUpdates registers the
    # App IDs and the App Group the first time).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W3GXL2NQQP
  configs:
    # iCloud sync (TomoSync): Debug builds use CloudKit's Development environment, TestFlight and the App Store
    # Production. Xcode sets the iCloud and push environments in the entitlements when it exports.
    Debug:
      TOMO_ICLOUD_ENV: Development
    Release:
      TOMO_ICLOUD_ENV: Production

schemes:
  Tomodachi:
    build:
      targets:
        Tomodachi: all
    run:
      config: Debug

targets:
  Tomodachi:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Shared
        type: group
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: TomoCore
      - target: TomoWidgets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tomodachi
        CFBundleDisplayName: Tomodachi
        CFBundleIdentifier: com.zenbujapanese.tomodachi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]   # CloudKit's push when the Mac changed Tomo (TomoSync)
        TomoICloudEnvironment: $(TOMO_ICLOUD_ENV)   # this build has iCloud (TomoSync)
        ITSAppUsesNonExemptEncryption: false   # only Apple's own encryption (HTTPS): no export paperwork
        NSMicrophoneUsageDescription: "Tomo listens when you answer out loud."
        NSSpeechRecognitionUsageDescription: "Tomo turns what you say into text to understand you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi
        PRODUCT_NAME: Tomodachi
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Resources/Tomodachi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Tomo on sky blue, drawn from its code (TOMO_RENDER_ICON)

  # Home Screen widgets (issue #52). Reads TomoGlance from the App Group; draws Tomo with TomoMovingChick.
  TomoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: TomoCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tomodachi
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        UIAppFonts: [TomoReady0.ttf, TomoReady1.ttf, TomoReady2.ttf, TomoSleep0.ttf, TomoSleep1.ttf, TomoSleep2.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi.widgets
        PRODUCT_NAME: TomoWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: YES
