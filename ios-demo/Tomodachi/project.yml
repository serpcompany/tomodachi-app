name: Tomodachi
options:
  bundleIdPrefix: com.zenbujapanese
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  TomoCore:
    path: ../../TomoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      # Simulator: signed to run locally, so the App Group (app ↔ widgets) works without a team
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"

schemes:
  Tomodachi:
    build:
      targets:
        Tomodachi: all
    run:
      config: Debug

targets:
  Tomodachi:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: TomoCore
      - target: TomoWidgets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tomodachi
        CFBundleDisplayName: Tomodachi
        CFBundleIdentifier: com.zenbujapanese.tomodachi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.0.1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Tomo listens when you answer out loud."
        NSSpeechRecognitionUsageDescription: "Tomo turns what you say into text to understand you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi
        PRODUCT_NAME: Tomodachi
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Resources/Tomodachi.entitlements

  # Home Screen widgets (issue #52). Reads TomoGlance from the App Group; draws Tomo with TomoChickStill.
  TomoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: TomoCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tomodachi
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi.widgets
        PRODUCT_NAME: TomoWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: YES
