name: NotchBuddy
options:
  bundleIdPrefix: com.zenbujapanese
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  TomoCore:
    path: ../../TomoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # The team the iPhone app ships with (decisions.md): iCloud sync (#62) needs both apps on one team.
    # Xcode signs automatically: Debug with an Apple Development profile, the owner's copy and beta builds with
    # a Developer ID profile at export (scripts/release-beta.sh). -allowProvisioningUpdates registers this Mac
    # and the profiles the first time.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W3GXL2NQQP
    CODE_SIGN_ENTITLEMENTS: Resources/Tomodachi.entitlements
  configs:
    # iCloud sync (TomoSync) and its push notifications: Debug builds use CloudKit's Development environment,
    # so tests never touch a learner's real Tomo; Developer ID builds use Production, like the iPhone app.
    Debug:
      TOMO_ICLOUD_ENV: Development
    Release:
      TOMO_ICLOUD_ENV: Production
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: TomoCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tomodachi
        CFBundleDisplayName: Tomodachi
        NSHumanReadableCopyright: "Tomodachi by Zenbu Japanese. © 2026 Zenbu Japanese."
        CFBundleIdentifier: com.zenbujapanese.tomodachi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.0.2"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TomoICloudEnvironment: $(TOMO_ICLOUD_ENV)   # this build has iCloud (TomoSync)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenbujapanese.tomodachi
        PRODUCT_NAME: Tomodachi
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
